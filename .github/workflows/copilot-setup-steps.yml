name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Select supported Copilot model
        run: echo "COPILOT_AGENT_MODEL=sweagent-capi:gpt-5-mini" >> "$GITHUB_ENV"
