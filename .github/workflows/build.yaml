name: build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - 'release-v*'
      - 'feat/*'
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'web/**'
      - 'manifests/**'
      - 'charts/**'
      - 'tool/**'
      - 'hack/**'
      - '.github/workflows/build.yaml'
      - 'Makefile'
      - '**/go.mod'
      - '**/go.sum'
      - '**/yarn.lock'

permissions:
  contents: read

env:
  GO_VERSION: 1.25.0
  NODE_VERSION: 18.12.0
  HELM_VERSION: 3.8.2

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      helm: ${{ steps.filter.outputs.helm }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'cmd/**'
              - 'pkg/**'
              - '**/go.mod'
              - '**/go.sum'
            web:
              - 'web/**'
              - '**/yarn.lock'
            helm:
              - 'manifests/**'
              - 'charts/**'
            ci:
              - '.github/workflows/build.yaml'
              - 'Makefile'
              - 'hack/**'

  go:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@v3
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build go modules
        run: make build/go

  plugin:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@v3
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build plugin
        run: make build/plugin

  web:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Update web dependencies
        run: make update/web-deps
      - name: Build web static
        run: make build/web

  chart:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.helm == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Package helm charts
        run: make build/chart
