name: Setup web toolchain
description: >-
  Set up Node.js with the built-in yarn cache and install the web dependencies.
  Replaces the copy-pasted setup-node + manual actions/cache + update/web-deps
  block previously duplicated across build, lint and test workflows.

inputs:
  node-version:
    description: Node.js version to install
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: yarn
        cache-dependency-path: web/yarn.lock
    - name: Update web dependencies
      shell: bash
      run: make update/web-deps
