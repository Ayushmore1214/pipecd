# actions/labeler v5 configuration format.
# Each label maps to a set of match rules; here we label a PR when any changed
# file matches any of the listed globs.
area/go:
  - changed-files:
      - any-glob-to-any-file:
          - 'cmd/*'
          - 'cmd/**/*'
          - 'pkg/*'
          - 'pkg/**/*'

area/web:
  - changed-files:
      - any-glob-to-any-file:
          - 'web/*'
          - 'web/**/*'

area/build:
  - changed-files:
      - any-glob-to-any-file:
          - 'hack/*'
          - '.github/*'
          - '.github/**/*'
          - 'Makefile'
          - 'local/*'

area/manifests:
  - changed-files:
      - any-glob-to-any-file:
          - 'manifests/**/*'

area/docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/*'
          - 'docs/**/*'
          - 'README.md'
          - 'CONTRIBUTING.md'
          - 'RELEASES.md'

area/examples:
  - changed-files:
      - any-glob-to-any-file:
          - 'examples/*'
          - 'examples/**/*'

area/tool:
  - changed-files:
      - any-glob-to-any-file:
          - 'tool/*'
          - 'tool/**/*'

area/pipedv1:
  - changed-files:
      - any-glob-to-any-file:
          - 'pkg/app/pipedv1/**/*'
          - 'pkg/configv1/*'
          - 'pkg/configv1/**/*'

area/plugin-sdk:
  - changed-files:
      - any-glob-to-any-file:
          - 'pkg/plugin/sdk/**/*'
